<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>漫画书架</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #101014; color: #e8e8ea;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---------- 通用按钮 ---------- */
  .btn {
    background: #23232b; color: #e8e8ea; border: 0; border-radius: 9px;
    padding: 8px 11px; font-size: 12.5px; line-height: 1; white-space: nowrap;
  }
  .btn:active { background: #2f2f3a; }
  .btn.primary { background: #3b6ef0; }
  .btn.primary:active { background: #2f5cd0; }
  .btn.on { background: #3b6ef0; }
  select.btn { padding: 8px 4px; }

  /* ---------- 书架 ---------- */
  .topbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 14px 14px 10px; padding-top: calc(14px + env(safe-area-inset-top));
  }
  .topbar h1 { font-size: 17px; font-weight: 600; }
  .topbar .sub { font-size: 12px; color: #8a8a92; }
  .topbar .spacer { flex: 1; }

  #grid {
    flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(106px, 1fr));
    gap: 12px; padding: 8px 14px 28px; align-content: start;
  }
  .card { position: relative; }
  .cover-box {
    position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 8px;
    background: #1c1c24; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  .cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-box .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #4a4a55; font-size: 26px;
  }
  .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0,0,0,.5); }
  .prog i { display: block; height: 100%; background: #3b6ef0; width: 0; }
  .card .t {
    font-size: 12px; line-height: 1.35; margin-top: 6px; color: #d7d7db;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .m { font-size: 10.5px; color: #75757f; margin-top: 2px; }
  .empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: #6a6a75; font-size: 13px; text-align: center; padding: 30px;
  }
  .empty b { font-size: 40px; }

  /* ---------- 阅读器 ---------- */
  .rhead {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top));
    background: #15151a;
  }
  .rhead .title {
    flex: 1; font-size: 12.5px; color: #c9c9d0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .rhead .info { font-size: 11.5px; color: #8a8a92; white-space: nowrap; }

  .stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; }
  #singleWrap, #doubleWrap {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    gap: 4px; overflow: hidden;
  }
  #singleWrap img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  #doubleWrap img { max-width: 49%; max-height: 100%; object-fit: contain; display: block; }
  #scrollWrap { position: absolute; inset: 0; }
  #scrollBox {
    position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #000;
  }
  #scrollBox .slot {
    width: 100%; display: flex; align-items: center; justify-content: center;
    background: #0a0a0c; overflow: hidden;
  }
  #scrollBox .slot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #scrollBox .slot:not(.ready) img { visibility: hidden; }

  .rfoot {
    flex: 0 0 auto; padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: #15151a; display: flex; align-items: center; gap: 8px;
  }
  .rfoot input[type=range] { flex: 1; height: 22px; accent-color: #3b6ef0; min-width: 60px; }
  .jump { display: flex; align-items: center; gap: 4px; }
  .jump input {
    width: 46px; background: #23232b; border: 0; color: #e8e8ea;
    border-radius: 7px; padding: 6px 4px; font-size: 12px; text-align: center;
  }

  /* ---------- 页栏 ---------- */
  .strip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; background: #121217; border-top: 1px solid #222;
  }
  .strip .cells {
    flex: 1; display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .strip .cell { flex: 0 0 auto; width: 54px; text-align: center; }
  .strip .cell img {
    width: 54px; height: 76px; object-fit: cover; border-radius: 4px;
    border: 2px solid transparent; background: #1c1c24; display: block;
  }
  .strip .cell.cur img { border-color: #3b6ef0; }
  .strip .cell span { font-size: 10px; color: #7c7c88; }
  .strip .nav { width: 22px; text-align: center; color: #7c7c88; font-size: 15px; }

  /* ---------- 遮罩 ---------- */
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .panel {
    background: #1b1b22; border-radius: 14px; padding: 20px; width: 80%; max-width: 330px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .panel h3 { font-size: 15px; margin-bottom: 6px; }
  .panel .q { font-size: 11.5px; color: #7f7f8b; margin-bottom: 10px; }
  .panel p { font-size: 12.5px; color: #9a9aa4; line-height: 1.6; }
  .panel .pbar { height: 6px; background: #2b2b34; border-radius: 3px; overflow: hidden; margin: 12px 0 8px; }
  .panel .pbar i { display: block; height: 100%; width: 0; background: #3b6ef0; transition: width .2s; }
  .panel .row { display: flex; gap: 10px; margin-top: 14px; }
  .panel .row .btn { flex: 1; text-align: center; padding: 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
    background: rgba(40,40,48,.95); color: #e8e8ea; font-size: 12.5px;
    padding: 9px 14px; border-radius: 20px; z-index: 60; opacity: 0; transition: opacity .2s;
    pointer-events: none; max-width: 80%; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ============ 书架 ============ -->
<div id="shelfView" class="view">
  <div class="topbar">
    <h1>📚 书架</h1><span class="sub" id="shelfSub"></span>
    <span class="spacer"></span>
    <select class="btn" id="sortSel">
      <option value="time">按时间</option>
      <option value="name">按名称</option>
    </select>
    <button class="btn primary" id="importBtn">导入</button>
  </div>
  <div id="grid"></div>
  <div class="empty" id="emptyBox">
    <b>📂</b>
    <div id="emptyText">书架还是空的<br />点右上角「导入」选压缩包</div>
  </div>
</div>

<!-- ============ 阅读器 ============ -->
<div id="readerView" class="view hidden">
  <div class="rhead">
    <button class="btn" id="backBtn">← 书架</button>
    <div class="title" id="rTitle"></div>
    <div class="info" id="rInfo"></div>
    <button class="btn" id="modeBtn">单页</button>
    <button class="btn" id="stripBtn">页栏</button>
  </div>

  <div class="stage" id="stage">
    <div id="singleWrap"><img id="pageImg" alt="" /></div>
    <div id="doubleWrap" class="hidden"><img id="pageImgL" alt="" /><img id="pageImgR" alt="" /></div>
    <div id="scrollWrap" class="hidden"><div id="scrollBox"></div></div>
  </div>

  <div class="strip hidden" id="thumbStrip">
    <div class="nav" id="stripPrev">‹</div>
    <div class="cells" id="stripCells"></div>
    <div class="nav" id="stripNext">›</div>
  </div>

  <div class="rfoot">
    <button class="btn" id="prevBtn">上一页</button>
    <input type="range" id="slider" min="0" max="0" value="0" />
    <div class="jump">
      <input type="number" id="jumpInput" min="1" />
      <button class="btn" id="jumpBtn">跳</button>
    </div>
    <button class="btn" id="nextBtn">下一页</button>
  </div>
</div>

<!-- ============ 遮罩层 ============ -->
<div class="mask hidden" id="importMask">
  <div class="panel">
    <h3>正在导入</h3>
    <div class="q" id="impQueue"></div>
    <p id="impName">准备中…</p>
    <div class="pbar"><i id="impBar"></i></div>
    <p style="font-size:11.5px;color:#6f6f7a">大文件需要几分钟，导入会排队进行</p>
  </div>
</div>

<div class="mask hidden" id="confirmMask">
  <div class="panel">
    <h3>删除这本书？</h3>
    <p id="cfText">会同时删掉 App 里存的压缩包，无法恢复。</p>
    <div class="row">
      <button class="btn" id="cfNo">取消</button>
      <button class="btn primary" id="cfYes">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================================================================
 * 存储/解压全部在原生（window.ComicLib），网页只画界面。
 * 阅读器三种模式：单页 / 双页 / 连续滚动（滚动模式做窗口化加载）。
 * ================================================================== */
var Lib = window.ComicLib;
var hasLib = !!(Lib && typeof Lib.listBooks === 'function');

var shelfView = document.getElementById('shelfView');
var readerView = document.getElementById('readerView');
var grid = document.getElementById('grid');
var shelfSub = document.getElementById('shelfSub');
var emptyBox = document.getElementById('emptyBox');
var emptyText = document.getElementById('emptyText');
var sortSel = document.getElementById('sortSel');
var importBtn = document.getElementById('importBtn');

var rTitle = document.getElementById('rTitle');
var rInfo = document.getElementById('rInfo');
var stage = document.getElementById('stage');
var singleWrap = document.getElementById('singleWrap');
var doubleWrap = document.getElementById('doubleWrap');
var scrollWrap = document.getElementById('scrollWrap');
var scrollBox = document.getElementById('scrollBox');
var pageImg = document.getElementById('pageImg');
var pageImgL = document.getElementById('pageImgL');
var pageImgR = document.getElementById('pageImgR');
var slider = document.getElementById('slider');
var jumpInput = document.getElementById('jumpInput');
var backBtn = document.getElementById('backBtn');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var jumpBtn = document.getElementById('jumpBtn');
var modeBtn = document.getElementById('modeBtn');
var stripBtn = document.getElementById('stripBtn');
var thumbStrip = document.getElementById('thumbStrip');
var stripCells = document.getElementById('stripCells');
var stripPrev = document.getElementById('stripPrev');
var stripNext = document.getElementById('stripNext');

var importMask = document.getElementById('importMask');
var impQueue = document.getElementById('impQueue');
var impName = document.getElementById('impName');
var impBar = document.getElementById('impBar');
var confirmMask = document.getElementById('confirmMask');
var cfText = document.getElementById('cfText');
var cfYes = document.getElementById('cfYes');
var cfNo = document.getElementById('cfNo');
var toastEl = document.getElementById('toast');

/* ================= 全局状态 ================= */
var books = [];
var sortMode = 'time';
var importing = false;
var pollTimer = 0;
var pendingDelete = null;

/* ================= 小工具 ================= */
var toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
}

function fmtSize(bytes) {
  if (!bytes) return '0M';
  var mb = bytes / 1048576;
  return mb >= 1024 ? (mb / 1024).toFixed(1) + 'G' : Math.round(mb) + 'M';
}

/* ================= 书架 ================= */
function refresh() {
  if (!hasLib) return;
  var data;
  try {
    data = JSON.parse(Lib.listBooks());
  } catch (e) {
    console.warn('listBooks failed', e);
    return;
  }
  books = data.books || [];
  importing = !!data.importing;

  if (importing) {
    importMask.classList.remove('hidden');
    var done = data.queueDone || 0;
    var left = data.queueRemaining || 0;
    impQueue.textContent = left > 0
      ? '已完成 ' + done + ' 本 · 还剩 ' + left + ' 本'
      : '已完成 ' + done + ' 本';
    impName.textContent = data.importTitle || '正在读取…';
    impBar.style.width = (data.importPercent || 0) + '%';
    startPolling();
  } else {
    importMask.classList.add('hidden');
    stopPolling();
  }

  renderShelf();
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(refresh, 400);
}
function stopPolling() {
  if (!pollTimer) return;
  clearInterval(pollTimer);
  pollTimer = 0;
}

function sortedBooks() {
  var arr = books.slice();
  if (sortMode === 'name') {
    arr.sort(function (a, b) {
      return String(a.title || '').localeCompare(String(b.title || ''), 'zh');
    });
  } else {
    arr.sort(function (a, b) { return (b.importedAt || 0) - (a.importedAt || 0); });
  }
  return arr;
}

var coverCache = new Map();

function renderShelf() {
  var list = sortedBooks();
  shelfSub.textContent = list.length ? list.length + ' 本' : '';
  grid.innerHTML = '';

  if (!list.length) {
    emptyBox.classList.remove('hidden');
    emptyText.innerHTML = hasLib
      ? '书架还是空的<br />点右上角「导入」选压缩包'
      : '请在 App 内打开<br />（浏览器里没有原生存储）';
    return;
  }
  emptyBox.classList.add('hidden');
  for (var i = 0; i < list.length; i++) grid.appendChild(buildCard(list[i]));
}

var observer = ('IntersectionObserver' in window)
  ? new IntersectionObserver(function (entries) {
      for (var k = 0; k < entries.length; k++) {
        var entry = entries[k];
        if (!entry.isIntersecting) continue;
        var img = entry.target;
        if (img.getAttribute('src')) continue;
        var id = img.dataset.id;
        var url = coverCache.get(id);
        if (url === undefined) {
          try { url = Lib.getCover(id) || ''; } catch (e) { url = ''; }
          coverCache.set(id, url);
        }
        if (url) img.src = url;
        observer.unobserve(img);
      }
    }, { root: grid, rootMargin: '240px' })
  : null;

function buildCard(book) {
  var card = document.createElement('div');
  card.className = 'card';

  var box = document.createElement('div');
  box.className = 'cover-box';

  var ph = document.createElement('div');
  ph.className = 'ph';
  ph.textContent = '📕';
  box.appendChild(ph);

  var img = document.createElement('img');
  img.dataset.id = book.id;
  img.alt = '';
  box.appendChild(img);

  var prog = document.createElement('div');
  prog.className = 'prog';
  var bar = document.createElement('i');
  var pages = Math.max(1, book.pages || 1);
  var read = Math.min(book.lastRead || 0, pages - 1);
  bar.style.width = (((read + (read > 0 ? 1 : 0)) / pages) * 100) + '%';
  prog.appendChild(bar);
  box.appendChild(prog);

  var title = document.createElement('div');
  title.className = 't';
  title.textContent = book.title || '未命名';

  var meta = document.createElement('div');
  meta.className = 'm';
  meta.textContent = (book.pages || 0) + ' 页 · ' + fmtSize(book.size);

  card.appendChild(box);
  card.appendChild(title);
  card.appendChild(meta);

  if (observer) observer.observe(img);

  var pressTimer = 0;
  var moved = false;
  var longPressed = false;

  box.addEventListener('pointerdown', function () {
    moved = false;
    longPressed = false;
    pressTimer = setTimeout(function () {
      longPressed = true;
      askDelete(book);
    }, 650);
  });
  box.addEventListener('pointermove', function () { moved = true; clearTimeout(pressTimer); });
  box.addEventListener('pointerup', function () { clearTimeout(pressTimer); });
  box.addEventListener('pointercancel', function () { clearTimeout(pressTimer); });
  box.addEventListener('click', function () {
    clearTimeout(pressTimer);
    if (moved || longPressed) { longPressed = false; return; }
    openBook(book, book.lastRead || 0);
  });

  return card;
}

/* ================= 删除 ================= */
function askDelete(book) {
  pendingDelete = book;
  cfText.textContent = '《' + (book.title || '未命名') + '》会连同 App 里存的压缩包一起删除，无法恢复。';
  confirmMask.classList.remove('hidden');
}
cfNo.addEventListener('click', function () {
  pendingDelete = null;
  confirmMask.classList.add('hidden');
});
cfYes.addEventListener('click', function () {
  var book = pendingDelete;
  pendingDelete = null;
  confirmMask.classList.add('hidden');
  if (!book) return;
  if (hasLib) Lib.deleteBook(book.id);
  coverCache.delete(book.id);
  toast('已删除');
  setTimeout(refresh, 300);
});

/* ================= 阅读器公共 ================= */
var currentBook = null;
var currentPage = 0;
var mode = 'single';
var pageCache = new Map();
var saveTimer = 0;
var readerOpen = false;

function totalPages() { return currentBook ? (currentBook.pages || 0) : 0; }

function pageUrl(index) {
  if (!currentBook) return '';
  if (index < 0 || index >= totalPages()) return '';
  var key = currentBook.id + ':' + index;
  if (pageCache.has(key)) return pageCache.get(key);
  var url = '';
  try { url = Lib.getPage(currentBook.id, index) || ''; } catch (e) { url = ''; }
  if (url) {
    pageCache.set(key, url);
    if (pageCache.size > 8) {
      var firstKey = pageCache.keys().next().value;
      pageCache.delete(firstKey);
    }
  }
  return url;
}

function openBook(book, startPage) {
  if (!hasLib) { toast('请在 App 内打开'); return; }
  var pages = Lib.pageCount(book.id);
  if (!pages) { toast('这本书的文件读不到了'); return; }

  currentBook = Object.assign({}, book, { pages: pages });
  currentPage = Math.max(0, Math.min(startPage || 0, pages - 1));
  pageCache = new Map();

  rTitle.textContent = currentBook.title || '未命名';
  slider.min = '0';
  slider.max = String(pages - 1);
  jumpInput.value = String(currentPage + 1);

  shelfView.classList.add('hidden');
  readerView.classList.remove('hidden');
  readerOpen = true;
  try { history.pushState({ reader: 1 }, ''); } catch (e) {}

  setMode(mode, true);
}

function closeReader(fromPop) {
  if (!readerOpen) return;
  flushProgress();
  readerOpen = false;
  readerView.classList.add('hidden');
  shelfView.classList.remove('hidden');
  if (scrollObserver) scrollObserver.disconnect();
  scrollBox.innerHTML = '';
  scrollSlots = [];
  pageImg.removeAttribute('src');
  pageImgL.removeAttribute('src');
  pageImgR.removeAttribute('src');
  pageCache = new Map();
  currentBook = null;
  if (!fromPop) {
    try { if (history.state && history.state.reader) history.back(); } catch (e) {}
  }
  refresh();
}

window.addEventListener('popstate', function () {
  if (readerOpen) closeReader(true);
});

/* ================= 模式切换 ================= */
modeBtn.addEventListener('click', function () {
  var next = mode === 'single' ? 'double' : (mode === 'double' ? 'scroll' : 'single');
  setMode(next, false);
});

function setMode(m, keepPage) {
  var oldMode = mode;
  mode = m;
  singleWrap.classList.toggle('hidden', m !== 'single');
  doubleWrap.classList.toggle('hidden', m !== 'double');
  scrollWrap.classList.toggle('hidden', m !== 'scroll');
  modeBtn.textContent = m === 'single' ? '单页' : (m === 'double' ? '双页' : '滚动');
  if (m === 'scroll') {
    stripOpen = false;
    stripBtn.classList.remove('on');
    thumbStrip.classList.add('hidden');
    buildScroll();
  } else {
    if (oldMode === 'scroll' && scrollObserver) {
      scrollObserver.disconnect();
      scrollBox.innerHTML = '';
      scrollSlots = [];
    }
    showPage(currentPage, true);
  }
  updateFoot();
}

/* ================= 单页 / 双页 ================= */
function showPage(index, immediate) {
  if (!currentBook) return;
  var pages = totalPages();
  if (index < 0 || index >= pages) return;
  if (mode === 'double' && index % 2 === 1 && index + 1 < pages) index = index - 1;

  currentPage = index;

  if (mode === 'double') {
    var left = pageUrl(index);
    var right = index + 1 < pages ? pageUrl(index + 1) : '';
    if (immediate) { pageImgL.removeAttribute('src'); pageImgR.removeAttribute('src'); }
    if (left) pageImgL.src = left;
    if (right) { pageImgR.classList.remove('hidden'); pageImgR.src = right; }
    else pageImgR.classList.add('hidden');
  } else {
    var url = pageUrl(index);
    if (immediate) pageImg.removeAttribute('src');
    if (url) pageImg.src = url; else toast('这一页读取失败');
  }

  updateFoot();
  scheduleSave();
  preloadNeighbours(index);
  if (stripOpen) renderStrip();
}

function preloadNeighbours(index) {
  clearTimeout(window.__preloadTimer);
  window.__preloadTimer = setTimeout(function () {
    if (!currentBook) return;
    pageUrl(index + 1);
    pageUrl(index + 2);
    pageUrl(index - 1);
  }, 220);
}

function updateFoot() {
  var pages = totalPages();
  rInfo.textContent = (currentPage + 1) + ' / ' + pages;
  slider.max = String(Math.max(0, pages - 1));
  slider.value = String(currentPage);
  jumpInput.value = String(currentPage + 1);
}

function step(delta) {
  if (mode === 'scroll') {
    var target = Math.max(0, Math.min(totalPages() - 1, currentPage + delta));
    scrollToPage(target);
    return;
  }
  var stepSize = mode === 'double' ? 2 : 1;
  showPage(currentPage + delta * stepSize);
}

prevBtn.addEventListener('click', function () { step(-1); });
nextBtn.addEventListener('click', function () { step(1); });

slider.addEventListener('input', function () {
  var target = parseInt(slider.value, 10);
  if (isNaN(target)) return;
  if (mode === 'scroll') scrollToPage(target);
  else showPage(target);
});

jumpBtn.addEventListener('click', function () {
  var n = parseInt(jumpInput.value, 10);
  if (isNaN(n)) return;
  if (mode === 'scroll') scrollToPage(n - 1);
  else showPage(n - 1);
});
jumpInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') jumpBtn.click(); });

/* ================= 连续滚动 ================= */
var scrollSlots = [];
var scrollObserver = null;
var slotOffsets = [];
var offsetsDirty = true;
var scrollTick = 0;

function stageHeight() {
  var h = stage.clientHeight;
  return h > 100 ? h : 400;
}

function buildScroll() {
  if (scrollObserver) scrollObserver.disconnect();
  scrollBox.innerHTML = '';
  scrollSlots = [];
  offsetsDirty = true;

  var pages = totalPages();
  var est = Math.round(stageHeight() * 1.45);
  var frag = document.createDocumentFragment();

  for (var i = 0; i < pages; i++) {
    var slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.i = String(i);
    slot.style.height = est + 'px';
    var img = document.createElement('img');
    img.alt = '';
    slot.appendChild(img);
    frag.appendChild(slot);
    scrollSlots.push({ el: slot, img: img, index: i, loaded: false, height: est });
  }
  scrollBox.appendChild(frag);

  scrollObserver = new IntersectionObserver(function (entries) {
    for (var k = 0; k < entries.length; k++) {
      var e = entries[k];
      if (!e.isIntersecting) continue;
      loadSlot(parseInt(e.target.dataset.i, 10));
    }
  }, { root: scrollBox, rootMargin: '800px 0px' });

  for (var j = 0; j < scrollSlots.length; j++) scrollObserver.observe(scrollSlots[j].el);

  // 先加载当前页附近的几页，避免一进来全黑
  for (var n = Math.max(0, currentPage - 1); n < Math.min(pages, currentPage + 3); n++) loadSlot(n);

  requestAnimationFrame(function () { scrollToPage(currentPage); });
}

function loadSlot(i) {
  var s = scrollSlots[i];
  if (!s || s.loaded) return;
  var url = pageUrl(i);
  if (!url) return;
  s.loaded = true;
  s.img.onload = function () {
    var w = s.img.naturalWidth || 0;
    var h = s.img.naturalHeight || 0;
    if (w > 0 && h > 0) {
      var target = Math.round(h * s.el.clientWidth / w);
      if (target > 0) {
        s.el.style.height = target + 'px';
        s.height = target;
        offsetsDirty = true;
      }
    }
    s.el.classList.add('ready');
  };
  s.img.src = url;
}

function unloadSlot(i) {
  var s = scrollSlots[i];
  if (!s || !s.loaded) return;
  s.img.removeAttribute('src');
  s.img.onload = null;
  s.loaded = false;
  s.el.classList.remove('ready');
  s.el.style.height = s.height + 'px';
}

function scrollToPage(i) {
  if (!scrollSlots.length) return;
  if (offsetsDirty) rebuildOffsets();
  var idx = Math.max(0, Math.min(i, scrollSlots.length - 1));
  scrollBox.scrollTop = slotOffsets.length ? slotOffsets[idx] : 0;
  currentPage = idx;
  updateFoot();
  scheduleSave();
}

function rebuildOffsets() {
  slotOffsets = new Array(scrollSlots.length);
  for (var i = 0; i < scrollSlots.length; i++) slotOffsets[i] = scrollSlots[i].el.offsetTop;
  offsetsDirty = false;
}

function pageAtY(y) {
  if (offsetsDirty) rebuildOffsets();
  var lo = 0;
  var hi = slotOffsets.length - 1;
  var ans = 0;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if (slotOffsets[mid] <= y) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return ans;
}

scrollBox.addEventListener('scroll', function () {
  if (!currentBook || mode !== 'scroll') return;
  var now = Date.now();
  if (now - scrollTick < 120) return;
  scrollTick = now;

  var y = scrollBox.scrollTop + scrollBox.clientHeight * 0.35;
  var idx = pageAtY(y);
  if (idx !== currentPage) {
    currentPage = idx;
    updateFoot();
    scheduleSave();
    keepWindow(idx);
  }
}, { passive: true });

function keepWindow(center) {
  for (var i = 0; i < scrollSlots.length; i++) {
    if (i < center - 12 || i > center + 14) unloadSlot(i);
  }
}

/* ================= 页栏 ================= */
var stripOpen = false;
var stripStart = 0;
var STRIP_SIZE = 20;

function stripRange() {
  var pages = totalPages();
  var start = Math.max(0, stripStart);
  var end = Math.min(pages, start + STRIP_SIZE);
  if (end - start < STRIP_SIZE) start = Math.max(0, end - STRIP_SIZE);
  return [start, end];
}

function renderStrip() {
  var range = stripRange();
  var search = stripCells.scrollLeft;
  stripCells.innerHTML = '';
  var pending = [];
  for (var i = range[0]; i < range[1]; i++) {
    var cell = document.createElement('div');
    cell.className = 'cell' + (i === currentPage ? ' cur' : '');
    var img = document.createElement('img');
    img.alt = '';
    var label = document.createElement('span');
    label.textContent = String(i + 1);
    cell.appendChild(img);
    cell.appendChild(label);
    (function (index) {
      cell.addEventListener('click', function () {
        if (mode === 'scroll') scrollToPage(index);
        else showPage(index);
      });
    })(i);
    stripCells.appendChild(cell);
    pending.push({ index: i, img: img });
  }
  stripCells.scrollLeft = search;
  fillThumbs(pending, currentBook.id);
}

/* 缩略图逐张异步取，避免一次性解码 20 张把界面卡住 */
function fillThumbs(list, bookId) {
  if (!list.length) return;
  if (!currentBook || currentBook.id !== bookId) return;
  var item = list.shift();
  try {
    var url = Lib.getThumb(bookId, item.index);
    if (url) item.img.src = url;
  } catch (e) {}
  if (list.length) {
    setTimeout(function () { fillThumbs(list, bookId); }, 0);
  }
}

stripBtn.addEventListener('click', function () {
  if (!currentBook) return;
  stripOpen = !stripOpen;
  if (stripOpen) {
    stripStart = Math.max(0, currentPage - 6);
    thumbStrip.classList.remove('hidden');
    stripBtn.classList.add('on');
    renderStrip();
  } else {
    thumbStrip.classList.add('hidden');
    stripBtn.classList.remove('on');
  }
});

stripPrev.addEventListener('click', function () {
  stripStart = Math.max(0, stripStart - STRIP_SIZE);
  renderStrip();
});
stripNext.addEventListener('click', function () {
  stripStart = Math.min(Math.max(0, totalPages() - 1), stripStart + STRIP_SIZE);
  renderStrip();
});

/* ================= 进度 ================= */
function scheduleSave() {
  if (!currentBook) return;
  clearTimeout(saveTimer);
  var id = currentBook.id;
  var page = currentPage;
  saveTimer = setTimeout(function () {
    if (hasLib) Lib.setProgress(id, page);
  }, 500);
}

function flushProgress() {
  clearTimeout(saveTimer);
  if (currentBook && hasLib) Lib.setProgress(currentBook.id, currentPage);
}

/* ================= 触摸 / 键盘 ================= */
var touchStartX = 0;
var touchStartY = 0;

stage.addEventListener('touchstart', function (e) {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

stage.addEventListener('touchend', function (e) {
  if (mode === 'scroll') return;
  var dx = e.changedTouches[0].screenX - touchStartX;
  var dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;
  step(dx > 0 ? -1 : 1);
}, { passive: true });

document.addEventListener('keydown', function (e) {
  if (!readerOpen) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

/* ================= 导入 / 排序 ================= */
importBtn.addEventListener('click', function () {
  if (!hasLib) { toast('请在 App 内打开'); return; }
  Lib.pickAndImport();
});

sortSel.addEventListener('change', function () {
  sortMode = sortSel.value;
  renderShelf();
});

/* ================= 原生回调 ================= */
window.__comicLibChanged = function () { refresh(); };

window.__comicLibImportDone = function (ids) {
  refresh();
  if (readerOpen) return;
  if (ids && ids.length) {
    var first = books.filter(function (b) { return b.id === ids[0]; })[0];
    if (first) setTimeout(function () { openBook(first, 0); }, 250);
  }
};

/* ================= 启动 ================= */
refresh();
backBtn.addEventListener('click', function () { closeReader(false); });
</script>
